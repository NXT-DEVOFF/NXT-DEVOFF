name: Snake de contributions

on:
  schedule:
    - cron: "0 */12 * * *"     # toutes les 12 heures
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generer les SVG du snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23F59E0B&color_dots=%232d3343,%23123a7a,%231E6FF0,%235b9bff,%23F59E0B
            dist/snake-light.svg?color_snake=%23B45309&color_dots=%23ebedf0,%23c6dcff,%237fb0ff,%231E6FF0,%23B45309

      # La premiere couleur de color_dots est la cellule VIDE. En sombre elle doit
      # rester un ardoise visible (#2d3343) : sur le fond #0d1117 de GitHub, un
      # quasi-noir disparait et la grille parait cassee.

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
